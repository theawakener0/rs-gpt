[package]
name = "rs-gpt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust implementation of Andrej Karpathy's microgpt"
license = "MIT"
repository = "https://github.com/theawakener0/rs-gpt"
readme = "README.md"
keywords = ["gpt", "llm", "autograd", "tui"]
categories = ["science", "command-line-utilities"]
include = ["src/**/*", "dataset/input.txt", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
rand = "0.10.2"
rand_distr = "0.6.0"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
